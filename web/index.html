<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GIMPS Watch</title>
<style>:root{color-scheme:dark;font-family:system-ui;background:#0b1220;color:#e3ecf7}body{max-width:1100px;margin:4rem auto;padding:0 1.2rem}h1{font-size:clamp(2rem,6vw,4rem);margin-bottom:.3rem}h2{margin-top:2rem}p{color:#9baec5;line-height:1.6}small{color:#9baec5}a{color:#7dd3fc}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1rem}.card{padding:1.3rem;border:1px solid #29394d;border-radius:14px;background:#121e30;overflow-wrap:anywhere}.state{color:#7dd3fc}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:.8rem}.error{color:#fda4af}button{background:#7dd3fc;color:#0b1220;border:0;border-radius:6px;padding:.65rem 1rem;cursor:pointer}progress{width:100%}</style>
<header><small>LOCAL OBSERVATIONS / RUST + SQLITE</small><h1>GIMPS Watch</h1><p>What your workers last reported, with the source evidence attached.</p></header>
<p id="status" role="status">Loading observations…</p><button id="refresh">Refresh</button><h2>Workers</h2><div class="grid" id="workers"></div><h2>Sources</h2><div class="grid" id="sources"></div><h2>Source records</h2><div id="events"></div><p>Read-only observer. This page does not control mprime or report account-wide totals. <a href="/v1/status">JSON status</a></p>
<script>
const el=(tag,text,cls)=>{const n=document.createElement(tag);n.textContent=text;if(cls)n.className=cls;return n};
async function refresh(){try{const [s,e]=await Promise.all(['/v1/status','/v1/events?limit=20'].map(async u=>{const r=await fetch(u);if(!r.ok)throw Error(`HTTP ${r.status}`);return r.json()}));document.querySelector('#status').textContent=s.note;const workers=document.querySelector('#workers');workers.replaceChildren();for(const w of s.workers){const c=el('article','','card');c.append(el('h3',w.worker_id),el('p',w.state.replaceAll('_',' '),'state'),el('p',`Assignment: ${w.assignment_id??'unknown'}`),el('p',`Identity: ${w.identity_confidence}`),el('p',w.percent==null?'Progress unavailable':`${w.percent}% · ${w.iteration} / ${w.total_iterations} iterations`),el('small',`Last observed: ${w.last_observed_at}`));if(w.last_error)c.append(el('p',w.last_error.message,'error'));workers.append(c)}if(!s.workers.length)workers.append(el('p','No worker identity has been observed.'));const sources=document.querySelector('#sources');sources.replaceChildren();for(const src of s.sources){const c=el('article','','card');c.append(el('h3',src.id),el('p',src.health,src.health==='ok'?'state':'error'),el('p',`Generation ${src.generation} · byte ${src.offset} · ${src.diagnostics} diagnostics`),el('small',`Last read: ${src.last_read_at??'never'}`));sources.append(c)}const events=document.querySelector('#events');events.replaceChildren();for(const item of e.items){const d=el('details');d.append(el('summary',`#${item.id} · ${item.record.event.kind} · ${item.record.provenance.source_id}`),el('pre',JSON.stringify(item.record,null,2)));events.append(d)}if(e.next_cursor)events.append(el('p',`Showing first 20 records; use /v1/events?cursor=${e.next_cursor} for the next page.`));}catch(e){document.querySelector('#status').textContent=`Unable to load observations: ${e.message}`}}
document.querySelector('#refresh').onclick=refresh;refresh();setInterval(refresh,5000);
</script></html>
